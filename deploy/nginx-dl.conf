# Include inside an existing server {} block.
# Set NUXT_APP_BASE_URL=/dl/ in the application's .env.
# nginx runs on the host; the application listens on 127.0.0.1:3000.
location = /dl {
    return 308 /dl/$is_args$args;
}

location ^~ /dl/ {
    # No trailing slash: Nuxt must receive the /dl/ prefix.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_max_body_size 64k;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
